image: mcr.microsoft.com/playwright:v1.62.1-jammy

definitions:
  caches:
    npm: ~/.npm

  steps:
    - step: &rfp-test
        size: 2x
        max-time: 120
        caches:
          - npm
        artifacts:
          - playwright-report/**
          - test-results/**
          - allure-results/**

# Manual only (Pipelines → Run pipeline). No branches/default = not on push.
pipelines:
  custom:
    demo:
      - step:
          <<: *rfp-test
          name: Run RFP Demo
          script:
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test --project=chromium --workers=1 --grep @demo

    set1:
      - step:
          <<: *rfp-test
          name: Run RFP Set 1
          script:
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test --project=chromium --workers=1 --grep @set1

    set2:
      - step:
          <<: *rfp-test
          name: Run RFP Set 2
          script:
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test --project=chromium --workers=1 --grep @set2

    regression:
      - step:
          <<: *rfp-test
          name: Run All RFP Regression
          script:
            - npm ci
            - npx playwright install --with-deps chromium
            - rm -f data/session-data.json data/session-data-w*.json
            - npx playwright test --project=chromium --workers=1 --grep "@set1|@set2"
